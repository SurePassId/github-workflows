name: Deploy IIS site
description: Deploy an IIS site through the restricted SandboxDeployment v2 JEA endpoint, or run upload-only transfer validation.
inputs:
  computer-name:
    description: WinRM computer name
    required: true
  username:
    description: WinRM username
    required: true
  password:
    description: WinRM password
    required: true
  site-env:
    description: alpha, dev, or sandbox
    required: true
  app-name:
    description: api, mfa, push, oidc, or oidc-client
    required: true
  source-path:
    description: Published application directory
    required: true
  app-assembly:
    description: Safe relative assembly path; a leading slash is permitted
    required: true
  run-id:
    description: Numeric GitHub run ID followed by hyphen and numeric attempt
    required: true
  keep-list:
    description: Must be empty for API/MFA (secure provisioning); other apps validate intent only during upload-only validation
    required: false
    default: ''
  health-check-url:
    description: Required HTTPS health URL on app-env.surepassid.com; must match the server-qualified endpoint for API/MFA deployments
    required: true
  upload-only:
    description: Set to 'true' to validate upload and cleanup without deploying; 'false' (default) performs health-verified v2 deployment for API/MFA
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Deploy or validate via restricted sandbox endpoint
      shell: pwsh
      env:
        DEPLOY_ACTION_PATH: ${{ github.action_path }}
        DEPLOY_COMPUTER_NAME: ${{ inputs.computer-name }}
        DEPLOY_USERNAME: ${{ inputs.username }}
        DEPLOY_PASSWORD: ${{ inputs.password }}
        DEPLOY_SITE_ENV: ${{ inputs.site-env }}
        DEPLOY_APP_NAME: ${{ inputs.app-name }}
        DEPLOY_SOURCE_PATH: ${{ inputs.source-path }}
        DEPLOY_APP_ASSEMBLY: ${{ inputs.app-assembly }}
        DEPLOY_RUN_ID: ${{ inputs.run-id }}
        DEPLOY_KEEP_LIST: ${{ inputs.keep-list }}
        DEPLOY_HEALTH_CHECK_URL: ${{ inputs.health-check-url }}
        DEPLOY_UPLOAD_ONLY: ${{ inputs.upload-only }}
      run: |
        & (Join-Path $env:DEPLOY_ACTION_PATH 'Deploy-IisSite.ps1')
