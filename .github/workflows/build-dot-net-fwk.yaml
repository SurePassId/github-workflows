# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build .NET Framework Web Apps

on:
  workflow_call:
    inputs:
      APP:
        required: true
        type: string
      SLOT:
        required: true
        type: string
      DEPLOY_ENV:
        required: true
        type: string
      BUILD_CONFIG:
        required: true
        type: string
      BUILD_PROJECT:
        required: true
        type: string
    secrets:
      SSH_KEY:
        required: true

jobs:
  build-dot-net-fwk:
    # windows-2019 to build ASP.NET Framework 4.8
    # runs-on: windows-2019
    runs-on: [self-hosted, windows-build-vm]

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{secrets.SSH_KEY}}

      - name: Initialize publish directory
        id: publish-directory
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP "publish-${{github.run_id}}-${{github.run_attempt}}-${{github.job}}-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $publishPath -ErrorAction Stop | Out-Null
          "path=$publishPath" >> $env:GITHUB_OUTPUT

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Restore NuGet packages
        run: nuget restore

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: DotNet restore
        run: dotnet restore

      - name: Build ${{inputs.BUILD_PROJECT}}
        shell: pwsh
        env:
          PUBLISH_PATH: ${{steps.publish-directory.outputs.path}}
        run: msbuild ${{inputs.BUILD_PROJECT}} /nologo /verbosity:m /t:Build /t:pipelinePreDeployCopyAllFilesToOneFolder /p:Configuration=${{inputs.BUILD_CONFIG}} "/p:_PackageTempDir=$env:PUBLISH_PATH/"

      - name: Prepare configuration destination
        shell: pwsh
        env:
          PUBLISH_PATH: ${{steps.publish-directory.outputs.path}}
        run: New-Item -ItemType Directory -Path (Join-Path $env:PUBLISH_PATH 'bin') -Force -ErrorAction Stop | Out-Null

      - name: Copy environment specific files in place.
        uses: SurePassId/copy-web-env-files@042023699388269110326b9f1df4abba8cbd2923 # Node 24 revision
        with:
          deployment-environment: ${{inputs.DEPLOY_ENV}}
          path: ${{steps.publish-directory.outputs.path}}

      - name: Upload build artifact app-${{inputs.APP}}-${{inputs.SLOT}} for deployment jobs.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{inputs.APP}}-${{inputs.SLOT}}
          path: ${{steps.publish-directory.outputs.path}}
          overwrite: true
          if-no-files-found: error

      - name: Clean publish directory
        if: ${{always() && steps.publish-directory.outputs.path != ''}}
        shell: pwsh
        env:
          PUBLISH_PATH: ${{steps.publish-directory.outputs.path}}
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (-not (Test-Path -LiteralPath $env:PUBLISH_PATH)) {
              break
            }
            try {
              Remove-Item -LiteralPath $env:PUBLISH_PATH -Recurse -Force -ErrorAction Stop
              break
            }
            catch {
              if (($_.Exception.HResult -band 0xFFFF) -ne 145 -or $attempt -eq 3) {
                throw
              }
              Write-Warning "Publish directory is not empty after cleanup attempt ${attempt}; retrying."
            }
          }
