name: Build and deploy to SANDBOXVM

on:
  workflow_call:
    inputs:
      DEPLOYMENT_ENVIRONMENT:
        description: "Target environment: alpha, dev, or sandbox. Derived from the ref when omitted."
        type: string
        required: false
        default: ""
    secrets:
      SUBMODULE_APP_ID:
        required: true
      SUBMODULE_APP_PRIVATE_KEY:
        required: true
      POSTMAN_API_KEY:
        required: true

env:
  PUBLISH_DIR: '${{ github.workspace }}\publish'

jobs:
  RunPostmanTests:
    runs-on: [self-hosted, windows-build-vm]

    steps:
      - name: Setup postman workflow variables
        env:
          # Via env rather than interpolation: a ref or input is caller-controlled text.
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.DEPLOYMENT_ENVIRONMENT }}
        run: |
          $SiteEnv = $env:DEPLOYMENT_ENVIRONMENT
          if (-not $SiteEnv) {
            # Optional trailing UTC timestamp: deploy tags are unique per deploy, since a moved tag does not reliably trigger a workflow.
            if ($env:GITHUB_REF -match '^refs/tags/deploy-to-(alpha|dev|sandbox)(-\d{4}\.\d{2}\.\d{2}-\d{2}\.\d{2}\.\d{2})?$') {
              $SiteEnv = $Matches[1]
            }
            else {
              Throw "Cannot derive a deployment environment from '$($env:GITHUB_REF)'. Push a deploy-to-<env>-<yyyy.MM.dd>-<HH.mm.ss> tag, or pass DEPLOYMENT_ENVIRONMENT."
            }
          }
          if ("alpha", "dev", "sandbox" -notcontains $SiteEnv) {
            Throw "Invalid deployment environment: '$SiteEnv'. Expected alpha, dev, or sandbox."
          }

          switch ("${{ github.repository }}") {
            "SurePassId/SurePassIdLegacyMfaServer" {
              Write-Host "Postman is not configured for: ${{ github.repository }}"
            }
            "SurePassId/SurePassIdApiServer" {
              echo "POSTMAN_COLLECTION_ID=4401059-378d5a1c-52ae-4f51-b3b1-da7d644de4d8" >> "${{ github.env }}"

              switch ($SiteEnv) {
                "alpha" {
                  echo "POSTMAN_ENVIRONMENT_ID=4401059-ca7694ba-49fb-4815-b8ca-685f47a8ed3f" >> "${{ github.env }}"
                }
                default {
                  Write-Host "Postman is not configured for: ${{ github.repository }} on $SiteEnv environment"
                }
              }
            }
            "SurePassId/SurePassIdPushServer" {
              Write-Host "Postman is not configured for: ${{ github.repository }}"
            }
            default {
              Throw "Invalid repository: ${{ github.repository }}"
            }
          }

      - name: Mint postman files token
        id: postman_token
        if: ${{ env.POSTMAN_ENVIRONMENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is deprecated in favour of `client-id`; switch once the org secret holds the App's client ID.
          app-id: ${{ secrets.SUBMODULE_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: PostmanFiles

      - name: Checkout postman files
        if: ${{ env.POSTMAN_ENVIRONMENT_ID != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SurePassId/PostmanFiles
          token: ${{ steps.postman_token.outputs.token }}
          persist-credentials: false

      - name: Install Postman CLI
        if: ${{ env.POSTMAN_ENVIRONMENT_ID != '' }}
        run: |
          powershell.exe -NoProfile `
                         -InputFormat None `
                         -ExecutionPolicy AllSigned `
                         -Command "[System.Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://dl-cli.pstmn.io/install/win64.ps1'))"

      - name: Login to Postman CLI
        if: ${{ env.POSTMAN_ENVIRONMENT_ID != '' }}
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests
        if: ${{ env.POSTMAN_ENVIRONMENT_ID != '' }}
        run: |
          postman collection run `
                  ${{ env.POSTMAN_COLLECTION_ID }} `
                  --environment ${{ env.POSTMAN_ENVIRONMENT_ID }} `
                  --globals workspace.postman_globals.json `
                  --verbose
