# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy to Azure App Service

on:
  workflow_call:
    inputs:
      APP:
        required: true
        type: string
      SLOT:
        required: true
        type: string
      DEPLOY_ENV:
        required: true
        type: string
      REGION:
        required: true
        type: string
    secrets:
      PUBLISH_PROFILE:
        required: true

jobs:
  deploy-to-app-service:
    #runs-on: windows-latest
    runs-on: [self-hosted, windows-build-vm]
    environment:
      name: app-${{inputs.APP}}-${{inputs.DEPLOY_ENV}}-${{inputs.REGION}}/${{inputs.SLOT}}
      url: ${{steps.deploy-to-webapp.outputs.webapp-url}}

    steps:
      - name: Initialize download directory
        id: download-directory
        shell: pwsh
        run: |
          $downloadPath = Join-Path $env:RUNNER_TEMP "download-${{github.run_id}}-${{github.run_attempt}}-${{github.job}}-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $downloadPath -ErrorAction Stop | Out-Null
          "path=$downloadPath" >> $env:GITHUB_OUTPUT

      - name: Download artifact app-${{inputs.APP}}-${{inputs.SLOT}} from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{inputs.APP}}-${{inputs.SLOT}}
          path: ${{steps.download-directory.outputs.path}}

      - name: Deploy to Azure App Service app-${{inputs.APP}}-${{inputs.DEPLOY_ENV}}-${{inputs.REGION}}/${{inputs.SLOT}}
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: app-${{inputs.APP}}-${{inputs.DEPLOY_ENV}}-${{inputs.REGION}}
          slot-name: ${{inputs.SLOT}}
          publish-profile: ${{secrets.PUBLISH_PROFILE}}
          package: ${{steps.download-directory.outputs.path}}

      - name: Clean download directory
        if: ${{always() && steps.download-directory.outputs.path != ''}}
        shell: pwsh
        env:
          DOWNLOAD_PATH: ${{steps.download-directory.outputs.path}}
        run: |
          if (Test-Path -LiteralPath $env:DOWNLOAD_PATH) {
            Remove-Item -LiteralPath $env:DOWNLOAD_PATH -Recurse -Force -ErrorAction Stop
          }

