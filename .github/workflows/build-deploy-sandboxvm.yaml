
name: Build and deploy to SANDBOXVM

on:
  workflow_call:
    inputs:
      SUBMODULE_APP_CLIENT_ID:
        description: 'GitHub App Client ID used for read-only recursive submodule checkout.'
        type: string
        required: true
      DEPLOYMENT_ENVIRONMENT:
        description: 'Manual deployment target: alpha, dev, or sandbox. Tag deployments derive the target from the ref.'
        type: string
        required: false
        default: ''
      DEPLOY_APP_NAME:
        description: 'The app name to deploy.'
        type: string
        required: false
        default: ''
      HEALTH_CHECK_PATH:
        description: 'Readiness path. Defaults to the existing API/MFA endpoint; required for other apps.'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_APP_PRIVATE_KEY:
        required: true
      SANDBOX_VM_USERNAME:
        required: true
      SANDBOX_VM_PASSWORD:
        required: true
      SANDBOX_VM_HOSTNAME:
        required: true
      SANDBOX_CONFIGURATION_ALPHA:
        description: 'Optional until activation: API/MFA alpha-only configuration bundle; see the hardening plan.'
        required: false
      SANDBOX_CONFIGURATION_DEV:
        description: 'Optional until activation: API/MFA dev-only configuration bundle; see the hardening plan.'
        required: false
      SANDBOX_CONFIGURATION_SANDBOX:
        description: 'Optional until activation: API/MFA sandbox-only configuration bundle; see the hardening plan.'
        required: false

env:
  PUBLISH_DIR: '${{ github.workspace }}\publish'
  TAG_REPOSITORY: true
  ENV_NAME: ''
  SITE_ENV: ''
  DOT_NET_TYPE: ''
  DOTNET_VERSION: ''
  CONFIGURATION: 'Release'
  APP_NAME: ''
  APP_SOLUTION: ''
  APP_PROJECT: ''
  APP_ASSEMBLY: ''
  HEALTH_CHECK_URL: ''
  # Keeps the files/folders in the destination path.
  KEEP_LIST: ''

defaults:
  run:
    shell: pwsh

jobs:
  BuildAndDeployToSandboxVM:
    runs-on: [self-hosted, windows-build-vm]
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: >-
        sandboxvm-deploy-${{ github.repository }}-${{
          github.repository == 'SurePassId/IdentityProvider' && inputs.DEPLOY_APP_NAME || 'default'
        }}-${{
          (startsWith(github.ref, 'refs/tags/deploy2alpha-') && 'alpha')
          || (startsWith(github.ref, 'refs/tags/deploy2dev-') && 'dev')
          || (startsWith(github.ref, 'refs/tags/deploy2sandbox-') && 'sandbox')
          || inputs.DEPLOYMENT_ENVIRONMENT || 'invalid' }}
      cancel-in-progress: false

    steps:
      - name: Validate submodule App configuration
        env:
          SUBMODULE_APP_CLIENT_ID: ${{ inputs.SUBMODULE_APP_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUBMODULE_APP_CLIENT_ID)) {
            Throw "SUBMODULE_APP_CLIENT_ID must contain the GitHub App Client ID."
          }

      - name: Setup workflow variables
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.DEPLOYMENT_ENVIRONMENT }}
          DEPLOY_APP_NAME: ${{ inputs.DEPLOY_APP_NAME }}
        run: |
          $SiteEnv = $env:DEPLOYMENT_ENVIRONMENT
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF -notmatch '^refs/tags/deploy2(?<siteEnv>alpha|dev|sandbox)-.*$') {
              Throw "Invalid deployment tag: $env:GITHUB_REF"
            }
            $TagSiteEnv = $Matches.siteEnv
            if ($SiteEnv -and $SiteEnv -ne $TagSiteEnv) {
              Throw "Deployment environment '$SiteEnv' conflicts with tag environment '$TagSiteEnv'."
            }
            $SiteEnv = $TagSiteEnv
          }
          if ("alpha", "dev", "sandbox" -notcontains $SiteEnv) {
            Throw "Invalid deployment environment: '$SiteEnv'. Expected alpha, dev, or sandbox; manual branch runs must supply DEPLOYMENT_ENVIRONMENT."
          }
          $SiteEnv = $SiteEnv.ToLowerInvariant()
          echo "SITE_ENV=$SiteEnv" >> "$env:GITHUB_ENV"

          switch ($env:GITHUB_REPOSITORY) {
            "SurePassId/SurePassIdLegacyMfaServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=mfa" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePass.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdLegacyMfaServer\SurePassIdLegacyMfaServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassAdmin.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdApiServer" {
              echo "ENV_NAME=mfa-$SiteEnv" >> "${{ github.env }}"
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=10.0.x" >> "${{ github.env }}"
              echo "APP_NAME=api" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdApiServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdApiServer\SurePassIdApiServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=SurePassIdApiServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdPushServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=push" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\PushServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\PushServer\PushServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassPushServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/IdentityProvider" {
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdOidcServer.sln" >> "${{ github.env }}"
              switch ($env:DEPLOY_APP_NAME) {
                "oidc" {
                  echo "CONFIGURATION=Debug" >> "${{ github.env }}"
                  echo "ENV_NAME=Development" >> "${{ github.env }}"
                  echo "APP_NAME=oidc" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProvider\IdentityProvider.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcServer.dll" >> "${{ github.env }}"
                  echo "KEEP_LIST=keys,logs,spidp_log.txt" >> "${{ github.env }}"
                }
                "oidc-client" {
                  echo "ENV_NAME=oidc-$SiteEnv" >> "${{ github.env }}"
                  echo "TAG_REPOSITORY=false" >> "${{ github.env }}"
                  echo "APP_NAME=oidc-client" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProviderTestApp\IdentityProviderTestApp.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcClient.dll" >> "${{ github.env }}"
                }
                default {
                  Throw "Invalid app name for SurePassId/IdentityProvider: $env:DEPLOY_APP_NAME"
                }
              }
            }
            default {
              Throw "Invalid repository: $env:GITHUB_REPOSITORY"
            }
          }

      - name: Resolve deployment health check
        env:
          HEALTH_CHECK_PATH: ${{ inputs.HEALTH_CHECK_PATH }}
        run: |
          $HealthCheckPath = $env:HEALTH_CHECK_PATH
          if ([string]::IsNullOrWhiteSpace($HealthCheckPath)) {
            switch ($env:APP_NAME) {
              'api' { $HealthCheckPath = '/status' }
              'mfa' { $HealthCheckPath = '/server/HealthCheck.aspx' }
              default { Throw "HEALTH_CHECK_PATH is required for $env:APP_NAME." }
            }
          }
          if ($HealthCheckPath -notmatch '^/[A-Za-z0-9/_.-]+$' -or $HealthCheckPath -match '(^|/)\.\.?(/|$)') {
            Throw "Invalid health-check path: '$HealthCheckPath'. Supply a readiness path without traversal or query parameters."
          }
          echo "HEALTH_CHECK_URL=https://$($env:APP_NAME)-$($env:SITE_ENV).surepassid.com$HealthCheckPath" >> "$env:GITHUB_ENV"

      ##################
      # Checkout code. #
      ##################
      - name: Mint read-only submodule token
        id: submodule_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            SurePassIdDotNetLibs
            SurePassIdFidoMDS
          permission-contents: read

      - name: Checkout ${{ github.repository }} and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          token: ${{ steps.submodule_token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Clean publish directory
        run: |
          $PublishPath = Join-Path $env:GITHUB_WORKSPACE 'publish'
          if (Test-Path -LiteralPath $PublishPath) {
            if ((Get-Item -LiteralPath $PublishPath).Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
              Throw "Refusing to clean a redirected publish directory: $PublishPath"
            }
            Remove-Item -LiteralPath $PublishPath -Recurse -Force
          }

      ########################
      # .NET Framework steps #
      ########################
      - name: Setup MSBuild path
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Restore the solution's NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_SOLUTION}} `
                  -restore `
                  -verbosity:minimal `
                  -property:RestorePackagesConfig=true

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_PROJECT}} `
                  -target:rebuild `
                  -verbosity:minimal `
                  -property:DeployOnBuild=True `
                  -property:Configuration=${{ env.CONFIGURATION }} `
                  -property:DeployTarget=WebPublish `
                  -property:DeleteExistingFiles=False `
                  -property:PublishProvider=FileSystem `
                  -property:WebPublishMethod=FileSystem `
                  -property:PublishUrl="${{ env.PUBLISH_DIR }}"

      ###################
      # .NET Core steps #
      ###################
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: '${{ runner.temp }}\dotnet'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet restore "${{ env.APP_SOLUTION }}" `
                 --source https://api.nuget.org/v3/index.json

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" `
                 --nologo `
                 --runtime win-x64 `
                 --self-contained true `
                 --configuration ${{ env.CONFIGURATION }} `
                 --output ${{ env.PUBLISH_DIR }} `
                 -p:EnvironmentName=${{ env.ENV_NAME }}

      ####################################
      # Copy envirinment specific files. #
      ####################################
      - name: Copy environment specific files in place.
        uses: SurePassId/copy-web-env-files@042023699388269110326b9f1df4abba8cbd2923 # node24
        with:
          deployment-environment: ${{ env.SITE_ENV }}
          path: "${{ env.PUBLISH_DIR }}"

      ##############################
      # Generate Release Tag Name. #
      ##############################
      - name: Prepare and validate deployment configuration
        env:
          DEPLOYMENT_CONFIGURATION: >-
            ${{ (env.SITE_ENV == 'alpha' && secrets.SANDBOX_CONFIGURATION_ALPHA)
              || (env.SITE_ENV == 'dev' && secrets.SANDBOX_CONFIGURATION_DEV)
              || (env.SITE_ENV == 'sandbox' && secrets.SANDBOX_CONFIGURATION_SANDBOX)
              || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-ConfigurationJson {
            param([string]$Text)
            try {
              $jsonOptions = [System.Text.Json.JsonDocumentOptions]::new()
              $jsonOptions.CommentHandling = [System.Text.Json.JsonCommentHandling]::Skip
              $jsonOptions.AllowTrailingCommas = $true
              $document = [System.Text.Json.JsonDocument]::Parse($Text, $jsonOptions)
              try {
                function Assert-UniqueProperties {
                  param($Element)
                  if ($Element.ValueKind -eq [System.Text.Json.JsonValueKind]::Object) {
                    $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
                    foreach ($property in $Element.EnumerateObject()) {
                      if (-not $names.Add($property.Name) -or $property.Name.Contains(':')) { throw 'Duplicate or flattened configuration key.' }
                      Assert-UniqueProperties $property.Value
                    }
                  } elseif ($Element.ValueKind -eq [System.Text.Json.JsonValueKind]::Array) {
                    foreach ($elementItem in $Element.EnumerateArray()) { Assert-UniqueProperties $elementItem }
                  }
                }
                Assert-UniqueProperties $document.RootElement
                $result = ConvertFrom-Json -InputObject $Text -AsHashtable
                if ($result -isnot [Collections.IDictionary]) { throw 'Expected an object.' }
                return $result
              } finally { $document.Dispose() }
            } catch {
              throw 'Configuration JSON must be an object with unique case-insensitive keys; details suppressed to protect secrets.'
            }
          }
          function Read-ConfigurationXml {
            param([byte[]]$Bytes, [string]$RootName = 'configuration')
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $stream = [IO.MemoryStream]::new($Bytes, $false)
            try {
              $reader = [Xml.XmlReader]::Create($stream, $settings)
              try {
                $document = [Xml.XmlDocument]::new()
                $document.XmlResolver = $null
                $document.Load($reader)
                if ($document.DocumentElement.Name -cne $RootName -or
                    $document.SelectNodes('//@configSource | //appSettings/@file | //@configProtectionProvider').Count) {
                  throw 'Configuration must be self-contained.'
                }
                return ,$document
              } finally { $reader.Dispose() }
            } catch {
              throw 'IIS configuration must be valid, self-contained XML without DTDs or encrypted/external sections; details suppressed to protect secrets.'
            } finally { $stream.Dispose() }
          }
          function Assert-PublishPath {
            param([string]$Path)
            $cursor = [IO.Path]::GetFullPath($Path)
            while ($cursor) {
              $item = Get-Item -LiteralPath $cursor -Force
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse point in publish path.' }
              $cursor = [IO.Path]::GetDirectoryName($cursor)
            }
            foreach ($item in (Get-ChildItem -LiteralPath $Path -Recurse -Force)) {
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse point in published content.' }
            }
          }
          Assert-PublishPath $env:PUBLISH_DIR
          if ([IO.Path]::GetFullPath($env:PUBLISH_DIR).TrimEnd('\') -ine
              [IO.Path]::Combine($env:GITHUB_WORKSPACE, 'publish').TrimEnd('\')) {
            throw 'Configuration preparation must use the owned workspace publish directory.'
          }
          if ($env:SITE_ENV -cnotin @('alpha', 'dev', 'sandbox')) { throw 'Invalid configuration environment.' }
          $webConfigPath = Join-Path $env:PUBLISH_DIR 'web.config'
          if ($env:APP_NAME -in @('api', 'mfa')) {
            if ($env:KEEP_LIST) { throw 'API/MFA provisioning forbids keep-list retention, including old binaries.' }
            if ([string]::IsNullOrWhiteSpace($env:DEPLOYMENT_CONFIGURATION)) {
              throw 'The selected environment requires its SANDBOX_CONFIGURATION secret. No live-file or other-environment fallback is permitted.'
            }
            $bundle = Read-ConfigurationJson $env:DEPLOYMENT_CONFIGURATION
            if ($bundle.Count -ne 3 -or $bundle.application -isnot [string] -or
                $bundle.application -cne $env:APP_NAME -or $bundle.environment -isnot [string] -or
                $bundle.environment -cne $env:SITE_ENV -or $bundle.files -isnot [Collections.IDictionary]) {
              throw 'Configuration bundle must contain only application, environment and files, matching the selected deployment.'
            }
            $allowedFiles = @('appsettings.local.json', 'site.lic')
            $requiredConfiguration = 'appsettings.local.json'
            $licenseRelativePath = 'site.lic'
            if ($env:APP_NAME -eq 'mfa') {
              $allowedFiles = @('web.config', 'bin/site.lic')
              $requiredConfiguration = 'web.config'
              $licenseRelativePath = 'bin/site.lic'
            }
            $files = @{}
            foreach ($fileName in $bundle.files.Keys) {
              if ($fileName -cnotin $allowedFiles -or $bundle.files[$fileName] -isnot [string]) {
                throw 'Configuration bundle contains an unsupported file or encoding. Application binaries and arbitrary paths are forbidden.'
              }
              try { $bytes = [Convert]::FromBase64String($bundle.files[$fileName]) } catch { throw 'Configuration file must be base64 encoded.' }
              if ($bytes.Length -eq 0) { throw 'Configuration and license files must be nonempty.' }
              $files[$fileName] = $bytes
            }
            if (-not $files.ContainsKey($requiredConfiguration)) { throw 'Required environment-specific configuration is missing from the bundle.' }
            $sitePath = "E:\iis_sites\$env:SITE_ENV\$env:APP_NAME-$env:SITE_ENV.surepassid.com"
            if ($env:APP_NAME -eq 'mfa') {
              $configuration = Read-ConfigurationXml $files['web.config']
              $appSettings = @{}
              foreach ($setting in $configuration.SelectNodes('/configuration/appSettings/add')) {
                if ($appSettings.ContainsKey($setting.GetAttribute('key'))) { throw 'Duplicate MFA appSettings key.' }
                $appSettings[$setting.GetAttribute('key')] = $setting.GetAttribute('value')
              }
              $licenseCode = $appSettings['MfaServerLicence.LicenseCode']
              $licenseDirectory = $appSettings['MfaServerLicence.FilePath']
              $licenseName = $appSettings['MfaServerLicence.Filename']
              $expectedLicenseDirectory = [IO.Path]::Combine($sitePath, 'bin')
              if (-not [string]::IsNullOrEmpty($licenseCode)) {
                throw 'MFA requires file licensing for its existing license-management UI; inline licensing is not supported by this deployment policy.'
              } elseif (($licenseDirectory -or $licenseName) -and
                  ($licenseDirectory -isnot [string] -or $licenseDirectory.TrimEnd('\') -ine $expectedLicenseDirectory -or $licenseName -cne 'site.lic')) {
                throw 'File licensing must use the same-site bin\site.lic path or the application defaults.'
              }
              $settingsNodes = $configuration.SelectNodes('/configuration/appSettings')
              if ($settingsNodes.Count -gt 1) { throw 'MFA configuration must have at most one appSettings section.' }
              $settingsNode = $configuration.SelectSingleNode('/configuration/appSettings')
              if ($null -eq $settingsNode) {
                $settingsNode = $configuration.CreateElement('appSettings')
                $null = $configuration.DocumentElement.AppendChild($settingsNode)
              }
              $licenseSettings = @{
                'MfaServerLicence.LicenseCode' = ''
                'MfaServerLicence.FilePath' = $expectedLicenseDirectory
                'MfaServerLicence.Filename' = 'site.lic'
              }
              foreach ($settingName in $licenseSettings.Keys) {
                foreach ($settingNode in @($settingsNode.ChildNodes)) {
                  if ($settingNode -is [Xml.XmlElement] -and $settingNode.GetAttribute('key') -ieq $settingName) {
                    $null = $settingsNode.RemoveChild($settingNode)
                  }
                }
                foreach ($operation in @('remove', 'add')) {
                  $settingNode = $configuration.CreateElement($operation)
                  $settingNode.SetAttribute('key', $settingName)
                  if ($operation -eq 'add') { $settingNode.SetAttribute('value', $licenseSettings[$settingName]) }
                  $null = $settingsNode.AppendChild($settingNode)
                }
              }
              if ($configuration.FirstChild -is [Xml.XmlDeclaration]) { $configuration.FirstChild.Encoding = 'utf-8' }
              $files['web.config'] = [Text.Encoding]::UTF8.GetBytes($configuration.OuterXml)
            } else {
              $configuration = Read-ConfigurationXml ([IO.File]::ReadAllBytes($webConfigPath))
              $environmentSettings = @($configuration.SelectNodes('//aspNetCore/environmentVariables/environmentVariable') |
                Where-Object { $_.GetAttribute('name') -in @('ASPNETCORE_ENVIRONMENT', 'DOTNET_ENVIRONMENT') })
              if (-not $environmentSettings.Count -or @($environmentSettings |
                  Where-Object { $_.GetAttribute('value') -cne "mfa-$env:SITE_ENV" }).Count) {
                throw 'Published API IIS environment must match the selected mfa-environment.'
              }
              $baseSettings = Read-ConfigurationJson ([IO.File]::ReadAllText((Join-Path $env:PUBLISH_DIR 'appsettings.json')))
              $environmentConfigPath = Join-Path $env:PUBLISH_DIR "appsettings.mfa-$env:SITE_ENV.json"
              $environmentSettings = Read-ConfigurationJson ([IO.File]::ReadAllText($environmentConfigPath))
              $null = Read-ConfigurationXml ([IO.File]::ReadAllBytes((Join-Path $env:PUBLISH_DIR 'logging.config'))) 'log4net'
              $utf8 = [Text.UTF8Encoding]::new($false, $true)
              try { $localText = $utf8.GetString($files['appsettings.local.json']) } catch { throw 'API local settings must be valid UTF-8.' }
              $localSettings = Read-ConfigurationJson $localText
              if ($localSettings.ConnectionStrings -isnot [Collections.IDictionary] -or
                  $localSettings.ConnectionStrings.MFA -isnot [string] -or
                  [string]::IsNullOrWhiteSpace($localSettings.ConnectionStrings.MFA) -or
                  $localSettings.AppSettings -isnot [Collections.IDictionary] -or
                  $localSettings.AppSettings.MfaServerLicense -isnot [Collections.IDictionary]) {
                throw 'API local settings must explicitly supply ConnectionStrings.MFA and AppSettings.MfaServerLicense.'
              }
              $license = $localSettings.AppSettings.MfaServerLicense
              if ($license.ValidationKey -isnot [string] -or [string]::IsNullOrWhiteSpace($license.ValidationKey)) {
                throw 'API license validation key must be supplied in local settings.'
              }
              # Override lower-priority license settings so only the selected bundle determines licensing.
              $licenseCode = $license.LicenseCode
              if ($null -ne $licenseCode -and $licenseCode -isnot [string]) { throw 'API license code must be a string.' }
              if ([string]::IsNullOrWhiteSpace($licenseCode)) { $licenseCode = '' }
              $licenseDirectory = $sitePath
              $expectedLicenseDirectory = $sitePath
              if ($license.Contains('FilePath')) { $licenseDirectory = $license.FilePath }
              $licenseName = 'site.lic'
              if ($license.Contains('Filename')) { $licenseName = $license.Filename }
              if (-not [string]::IsNullOrWhiteSpace($licenseCode)) {
                if ($files.ContainsKey($licenseRelativePath)) { throw 'Inline licensing must not also supply a license file.' }
              } elseif ($licenseDirectory -isnot [string] -or
                  $licenseDirectory.TrimEnd('\') -ine $expectedLicenseDirectory -or
                  $licenseName -isnot [string] -or $licenseName -cne 'site.lic') {
                throw 'File licensing must use the same-site site.lic path.'
              }
              $license.LicenseCode = [string]$licenseCode
              $license.FilePath = $sitePath
              $license.Filename = 'site.lic'
              $files['appsettings.local.json'] = $utf8.GetBytes(($localSettings | ConvertTo-Json -Depth 100 -Compress -WarningAction Stop))
              # Windows PowerShell 5.1 validates the same immutable JSON without comment/trailing-comma support.
              $files['appsettings.json'] = $utf8.GetBytes(($baseSettings | ConvertTo-Json -Depth 100 -Compress -WarningAction Stop))
              $files["appsettings.mfa-$env:SITE_ENV.json"] = $utf8.GetBytes(($environmentSettings | ConvertTo-Json -Depth 100 -Compress -WarningAction Stop))
            }
            if ([string]::IsNullOrWhiteSpace($licenseCode) -and -not $files.ContainsKey($licenseRelativePath)) {
              throw 'File licensing requires the selected environment license in the bundle.'
            }
            foreach ($fileName in $files.Keys) {
              $destination = Join-Path $env:PUBLISH_DIR $fileName
              $null = [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($destination))
              [IO.File]::WriteAllBytes($destination, $files[$fileName])
            }
            if (-not $files.ContainsKey($licenseRelativePath)) {
              $unusedLicense = Join-Path $env:PUBLISH_DIR $licenseRelativePath
              if (Test-Path -LiteralPath $unusedLicense) { Remove-Item -LiteralPath $unusedLicense -Force }
            }
            if ($env:APP_NAME -eq 'api') {
              foreach ($settingsFile in (Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Filter 'appsettings.*.json' -File)) {
                if ($settingsFile.Name -cnotin @('appsettings.local.json', "appsettings.mfa-$env:SITE_ENV.json")) {
                  Remove-Item -LiteralPath $settingsFile.FullName -Force
                }
              }
            }
          }
          if (-not (Test-Path -LiteralPath $webConfigPath -PathType Leaf) -or
              (Get-Item -LiteralPath $webConfigPath).Length -eq 0) {
            throw 'Published web.config is missing or empty. Configuration must be provisioned before deployment.'
          }
          Write-Host "Validated staged configuration for $env:APP_NAME/$env:SITE_ENV; no live-site files were read."

      - name: Generate Release Tag Name
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        run: |
          $assemblyPath = Join-Path $env:PUBLISH_DIR $env:APP_ASSEMBLY.TrimStart([char]'\')
          if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
            Throw "Expected published assembly was not found: $assemblyPath"
          }
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath).Version
          echo "APP_TAG_NAME=$($env:SITE_ENV)-$version" >> "$env:GITHUB_ENV"

      #######################################
      # Check the release tag before deploy #
      #######################################
      - name: Check release tag before deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const tagName = process.env.APP_TAG_NAME;
            let existing;
            try {
              existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
              core.info(`Release tag ${tagName} is available.`);
              return;
            }
            let target = existing.data.object;
            while (target.type === 'tag') {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: target.sha
              });
              target = annotated.data.object;
            }
            if (target.type !== 'commit' || target.sha !== context.sha) {
              throw new Error(`Release tag ${tagName} already points to ${target.sha}, not ${context.sha}. Increment the application version before deploying.`);
            }
            core.info(`Release tag ${tagName} already identifies this commit.`);

      #############################
      # Deploy files to sandboxvm #
      #############################
      - name: Deploy and verify ${{ env.APP_NAME }}-${{ env.SITE_ENV }}.surepassid.com
        uses: SurePassId/github-workflows/.github/actions/deploy-iis-site@d364d76cc30d9014701ad2c9ffc2c583c055e8eb
        with:
          computer-name: ${{ secrets.SANDBOX_VM_HOSTNAME }}
          username: ${{ secrets.SANDBOX_VM_USERNAME }}
          password: ${{ secrets.SANDBOX_VM_PASSWORD }}
          site-env: ${{ env.SITE_ENV }}
          app-name: ${{ env.APP_NAME }}
          source-path: ${{ env.PUBLISH_DIR }}
          app-assembly: ${{ env.APP_ASSEMBLY }}
          run-id: ${{ github.run_id }}-${{ github.run_attempt }}
          keep-list: ${{ env.KEEP_LIST }}
          health-check-url: ${{ env.HEALTH_CHECK_URL }}

      - name: Tag the successfully deployed commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const tagName = process.env.APP_TAG_NAME;
            try {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha: context.sha
                });
                core.info(`Created ${tagName} for the successfully deployed commit.`);
                return;
              } catch (err) {
                if (err.status !== 422) {
                  throw err;
                }
              }
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              let target = existing.data.object;
              while (target.type === 'tag') {
                const annotated = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: target.sha
                });
                target = annotated.data.object;
              }
              if (target.type !== 'commit' || target.sha !== context.sha) {
                throw new Error(`Release tag ${tagName} conflicts with ${target.sha}.`);
              }
              core.info(`Release tag ${tagName} already identifies the successfully deployed commit.`);
            } catch (err) {
              throw new Error(`Deployment succeeded, but release tagging failed: ${err.message}`, { cause: err });
            }

      - name: Remove provisioned configuration from runner
        if: ${{ always() && (env.APP_NAME == 'api' || env.APP_NAME == 'mfa') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishPath = [IO.Path]::GetFullPath($env:PUBLISH_DIR).TrimEnd('\')
          if ($publishPath -ine [IO.Path]::Combine($env:GITHUB_WORKSPACE, 'publish').TrimEnd('\')) {
            throw 'Refusing configuration cleanup outside the owned publish directory.'
          }
          if (Test-Path -LiteralPath $publishPath) {
            $cursor = $publishPath
            while ($cursor) {
              if ((Get-Item -LiteralPath $cursor -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'Reparse point in configuration cleanup path.'
              }
              $cursor = [IO.Path]::GetDirectoryName($cursor)
            }
            $configurationFiles = @('appsettings.local.json', 'site.lic')
            if ($env:APP_NAME -eq 'mfa') { $configurationFiles = @('web.config', 'bin\site.lic') }
            foreach ($relativePath in $configurationFiles) {
              $filePath = Join-Path $publishPath $relativePath
              $parentPath = [IO.Path]::GetDirectoryName($filePath)
              if ((Test-Path -LiteralPath $parentPath) -and
                  ((Get-Item -LiteralPath $parentPath -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                throw 'Reparse point in configuration cleanup parent.'
              }
              if (Test-Path -LiteralPath $filePath) {
                $item = Get-Item -LiteralPath $filePath -Force
                if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw 'Configuration cleanup target must be an ordinary file.'
                }
                Remove-Item -LiteralPath $filePath -Force
              }
            }
          }
