name: Build and deploy to SANDBOXVM

on:
  workflow_call:
    inputs:
      DEPLOY_APP_NAME:
        description: "The app name to deploy."
        type: string
        required: false
        default: ""
    secrets:
      # Transitional: callers pass either the App credentials or the PAT. The PAT goes away once all four have migrated.
      GH_ACTIONS_PAT:
        required: false
      SUBMODULE_APP_ID:
        required: false
      SUBMODULE_APP_PRIVATE_KEY:
        required: false
      SANDBOX_VM_USERNAME:
        required: true
      SANDBOX_VM_PASSWORD:
        required: true
      SANDBOX_VM_HOSTNAME:
        required: true

env:
  PUBLISH_DIR: '${{ github.workspace }}\publish'
  TAG_REPOSITORY: true
  ENV_NAME: ""
  SITE_ENV: ""
  DOT_NET_TYPE: ""
  DOTNET_VERSION: ""
  CONFIGURATION: "Release"
  APP_NAME: ""
  APP_SOLUTION: ""
  APP_PROJECT: ""
  APP_ASSEMBLY: ""
  # Keeps the files/folders in the destination path.
  KEEP_LIST: ""

# Explicit so the runner never falls back to Windows PowerShell 5.1, whose `>>` writes UTF-16LE and corrupts $GITHUB_ENV.
defaults:
  run:
    shell: pwsh

jobs:
  BuildAndDeployToSandboxVM:
    runs-on: [self-hosted, windows-build-vm]
    timeout-minutes: 45
    permissions:
      contents: write # release tag only
    env:
      # The `secrets` context is unavailable in a step-level `if`, so presence is surfaced through `env`.
      SUBMODULE_APP_ID: ${{ secrets.SUBMODULE_APP_ID }}
    concurrency:
      # Evaluated in the calling repository's context, so this serializes an app against itself only.
      group: sandboxvm-${{ github.repository }}-${{ github.ref_name }}-${{ inputs.DEPLOY_APP_NAME || 'default' }}
      cancel-in-progress: false

    steps:
      - name: Clean workspace
        run: |
          if (Test-Path -Path "${{ github.workspace }}") {
            Remove-Item -Recurse -Force -Path "${{ github.workspace }}\*"
          }

      - name: Setup workflow variables
        run: |
          $SiteEnv = ("${{ github.ref }}" -split "/")[-1]
          if ("alpha", "dev", "sandbox" -notcontains "$SiteEnv") {
            Throw "Invalid branch: ${{ github.ref }}"
          }
          echo "SITE_ENV=$SiteEnv" >> "${{ github.env }}"

          switch ("${{ github.repository }}") {
            "SurePassId/SurePassIdLegacyMfaServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=mfa" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePass.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdLegacyMfaServer\SurePassIdLegacyMfaServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassAdmin.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdApiServer" {
              echo "ENV_NAME=mfa-$SiteEnv" >> "${{ github.env }}"
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_NAME=api" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdApiServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdApiServer\SurePassIdApiServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=SurePassIdApiServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdPushServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=push" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\PushServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\PushServer\PushServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassPushServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/IdentityProvider" {
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdOidcServer.sln" >> "${{ github.env }}"
              switch ("${{ inputs.DEPLOY_APP_NAME }}") {
                "oidc" {
                  echo "CONFIGURATION=Debug" >> "${{ github.env }}"
                  echo "ENV_NAME=Development" >> "${{ github.env }}"
                  echo "APP_NAME=oidc" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProvider\IdentityProvider.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcServer.dll" >> "${{ github.env }}"
                  echo "KEEP_LIST=keys,logs,spidp_log.txt" >> "${{ github.env }}"
                }
                "oidc-client" {
                  echo "ENV_NAME=oidc-$SiteEnv" >> "${{ github.env }}"
                  echo "TAG_REPOSITORY=false" >> "${{ github.env }}"
                  echo "APP_NAME=oidc-client" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProviderTestApp\IdentityProviderTestApp.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcClient.dll" >> "${{ github.env }}"
                }
                default {
                  Throw "Invalid app name for SurePassId/IdentityProvider: ${{ inputs.DEPLOY_APP_NAME }}"
                }
              }
            }
            default {
              Throw "Invalid repository: ${{ github.repository }}"
            }
          }

      ##################
      # Checkout code. #
      ##################
      - name: Mint submodule token
        id: submodule_token
        if: ${{ env.SUBMODULE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is deprecated in favour of `client-id`; switch once the org secret holds the App's client ID.
          app-id: ${{ secrets.SUBMODULE_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout ${{ github.repository }} and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          token: ${{ steps.submodule_token.outputs.token || secrets.GH_ACTIONS_PAT }}
          persist-credentials: false

      ########################
      # .NET Framework steps #
      ########################
      - name: Setup MSBuild path
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Restore the solution's NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_SOLUTION}} `
                  -restore `
                  -verbosity:minimal `
                  -property:RestorePackagesConfig=true

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_PROJECT}} `
                  -target:rebuild `
                  -verbosity:minimal `
                  -property:DeployOnBuild=True `
                  -property:Configuration=${{ env.CONFIGURATION }} `
                  -property:DeployTarget=WebPublish `
                  -property:DeleteExistingFiles=False `
                  -property:PublishProvider=FileSystem `
                  -property:WebPublishMethod=FileSystem `
                  -property:PublishUrl="${{ env.PUBLISH_DIR }}"

      ###################
      # .NET Core steps #
      ###################
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet restore "${{ env.APP_SOLUTION }}" `
                 --runtime win-x64 `
                 --source https://api.nuget.org/v3/index.json

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" `
                 --nologo `
                 --runtime win-x64 `
                 --self-contained false `
                 --no-restore `
                 --configuration ${{ env.CONFIGURATION }} `
                 --output ${{ env.PUBLISH_DIR }} `
                 -p:EnvironmentName=${{ env.ENV_NAME }}

      ####################################
      # Copy environment specific files. #
      ####################################
      - name: Copy environment specific files in place.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: SurePassId/copy-web-env-files@042023699388269110326b9f1df4abba8cbd2923 # node24 runtime bump
        with:
          deployment-environment: ${{ env.SITE_ENV }}
          path: "${{ env.PUBLISH_DIR }}"

      ##############################
      # Generate Release Tag Name. #
      ##############################
      - name: Generate Release Tag Name
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        run: |
          $assemblyPath = Join-Path '${{ env.PUBLISH_DIR }}' '${{ env.APP_ASSEMBLY }}'
          if (-not (Test-Path -Path $assemblyPath)) {
              throw "Expected assembly not found at $assemblyPath. The publish step produced nothing usable."
          }
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath).Version
          echo "APP_TAG_NAME=${{ env.SITE_ENV }}-$version" >> "${{ github.env }}"

      #############################
      # Deploy files to sandboxvm #
      #############################
      - name: Deploy files to sandboxvm and restart ${{ env.APP_NAME }}-${{ env.SITE_ENV }}.surepassid.com.
        env:
          SANDBOX_VM_USERNAME: ${{ secrets.SANDBOX_VM_USERNAME }}
          SANDBOX_VM_PASSWORD: ${{ secrets.SANDBOX_VM_PASSWORD }}
          SANDBOX_VM_HOSTNAME: ${{ secrets.SANDBOX_VM_HOSTNAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -ge [version]'7.3') {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          $App             = "${{ env.APP_NAME }}"
          $SiteEnv         = "${{ env.SITE_ENV }}"
          $SiteDomainName  = "$App-$SiteEnv.surepassid.com"
          $SourcePath      = "${{ env.PUBLISH_DIR }}\*"
          $DestinationPath = "E:\iis_sites\$SiteEnv\$SiteDomainName"
          $KeepList        = "${{ env.KEEP_LIST }}"
          $SevenZip        = 'C:\Program Files\7-Zip\7z.exe'
          $Appcmd          = 'C:\Windows\System32\inetsrv\appcmd.exe'
          $RunId           = '${{ github.run_id }}-${{ github.run_attempt }}'
          $ArchiveName     = "deploy-$SiteDomainName-$RunId.7z"
          $LocalZipPath    = Join-Path $env:RUNNER_TEMP $ArchiveName

          $AzureVm    = $env:SANDBOX_VM_HOSTNAME
          $Credential = [pscredential]::new(
              $env:SANDBOX_VM_USERNAME,
              (ConvertTo-SecureString $env:SANDBOX_VM_PASSWORD -AsPlainText -Force)
          )

          function Invoke-Native {
              param(
                  [Parameter(Mandatory)][string]   $FilePath,
                  [Parameter(Mandatory)][string[]] $ArgumentList,
                  [string] $Description = $FilePath
              )
              & $FilePath @ArgumentList
              if ($LASTEXITCODE -ne 0) {
                  throw "$Description failed with exit code $LASTEXITCODE."
              }
          }

          # Declared global: so they persist for the life of the PSSession and every later Invoke-Command can call them.
          $RemoteHelpers = {
              $global:ErrorActionPreference = 'Stop'

              function global:Invoke-Native {
                  param(
                      [Parameter(Mandatory)][string]   $FilePath,
                      [Parameter(Mandatory)][string[]] $ArgumentList,
                      [string] $Description = $FilePath
                  )
                  & $FilePath @ArgumentList
                  if ($LASTEXITCODE -ne 0) {
                      throw "$Description failed with exit code $LASTEXITCODE."
                  }
              }

              function global:Wait-For {
                  param(
                      [Parameter(Mandatory)][scriptblock] $Condition,
                      [string] $Description = 'condition',
                      [int]    $TimeoutSeconds = 90
                  )
                  $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
                  while ((Get-Date) -lt $deadline) {
                      if (& $Condition) {
                          return
                      }
                      Start-Sleep -Milliseconds 500
                  }
                  throw "Timed out after $TimeoutSeconds seconds waiting for $Description."
              }
          }

          $session       = $null
          $iisStopped    = $false
          $contentIntact = $true

          try {
              Write-Host "================================================================================"
              Write-Host "Compress the source files"
              Write-Host "================================================================================"
              if (Test-Path -Path $LocalZipPath) {
                  Remove-Item -Path $LocalZipPath -Force
              }
              Invoke-Native -FilePath $SevenZip `
                            -ArgumentList @('a', '-t7z', $LocalZipPath, $SourcePath) `
                            -Description 'Compressing the publish output'

              $session = New-PSSession -ComputerName $AzureVm -Credential $Credential
              Invoke-Command -Session $session -ScriptBlock $RemoteHelpers

              Write-Host "================================================================================"
              Write-Host "Stopping $SiteDomainName"
              Write-Host "================================================================================"
              # Set before the stop, so the finally block restarts whatever a partial stop managed to take down.
              $iisStopped = $true
              Invoke-Command -Session $session -ScriptBlock {
                  param ($SiteDomainName, $Appcmd)
                  # Exit codes ignored on purpose: stopping an already-stopped site is not an error. Wait-For is the real assertion.
                  & $Appcmd stop site    $SiteDomainName 2>$null | Out-Null
                  & $Appcmd stop apppool $SiteDomainName 2>$null | Out-Null

                  Wait-For -Description "site $SiteDomainName to report Stopped" -TimeoutSeconds 90 -Condition {
                      (& $Appcmd list site "$SiteDomainName" /text:state 2>$null) -eq 'Stopped'
                  }
                  Wait-For -Description "app pool $SiteDomainName to report Stopped" -TimeoutSeconds 90 -Condition {
                      (& $Appcmd list apppool "$SiteDomainName" /text:state 2>$null) -eq 'Stopped'
                  }
                  Wait-For -Description 'worker processes to exit' -TimeoutSeconds 180 -Condition {
                      -not (& $Appcmd list wp /apppool.name:"$SiteDomainName" /text:name 2>$null)
                  }
              } -ArgumentList $SiteDomainName, $Appcmd

              Write-Host "================================================================================"
              Write-Host "Backup $SiteDomainName folder on the remote machine to a zip file."
              Write-Host "================================================================================"
              Invoke-Command -Session $session -ScriptBlock {
                  param ($DestinationPath, $SevenZip)
                  $formattedDateTime = (Get-Date).ToString("yyyy-MM-dd_HHmmss")
                  Invoke-Native -FilePath $SevenZip `
                                -ArgumentList @('a', '-t7z', "${DestinationPath}_$formattedDateTime.7z", $DestinationPath, '-xr!Trace') `
                                -Description 'Backing up the live directory'
              } -ArgumentList $DestinationPath, $SevenZip

              Write-Host "================================================================================"
              Write-Host "Keep only the last 3 Backups for $SiteDomainName on the remote machine."
              Write-Host "================================================================================"
              Invoke-Command -Session $session -ScriptBlock {
                  param ($DestinationPath)
                  Get-ChildItem -Path "${DestinationPath}_*.7z" |
                      Sort-Object LastWriteTime -Descending |
                      Select-Object -Skip 3 |
                      ForEach-Object { Remove-Item -Path $_.FullName -Force }
              } -ArgumentList $DestinationPath

              Write-Host "================================================================================"
              Write-Host "Deleting the files in $DestinationPath on $SiteDomainName on the remote machine."
              Write-Host "================================================================================"
              $contentIntact = $false
              Invoke-Command -Session $session -ScriptBlock {
                  param ($DestinationPath, $KeepList)
                  # Split the KeepList string into an array of files/folders to exclude from deletion.
                  if ([string]::IsNullOrEmpty($KeepList)) {
                      $exclusions = @()
                  } else {
                      $exclusions = $KeepList -split ','
                  }

                  Get-ChildItem -Path $DestinationPath | ForEach-Object {
                      if ($exclusions -notcontains $_.Name) {
                          Remove-Item -Recurse -Force -Path $_.FullName
                      }
                  }
              } -ArgumentList $DestinationPath, $KeepList

              Write-Host "================================================================================"
              Write-Host "Deploying to $DestinationPath on $SiteDomainName"
              Write-Host "================================================================================"
              Copy-Item -Path $LocalZipPath `
                        -Destination (Join-Path $DestinationPath $ArchiveName) `
                        -ToSession $session `
                        -Force

              Write-Host "================================================================================"
              Write-Host "Extract the compressed file on the remote machine"
              Write-Host "================================================================================"
              Invoke-Command -Session $session -ScriptBlock {
                  param ($DestinationPath, $ArchiveName, $SevenZip)
                  $remoteZipPath = Join-Path $DestinationPath $ArchiveName
                  Invoke-Native -FilePath $SevenZip `
                                -ArgumentList @('x', $remoteZipPath, "-o$DestinationPath", '-y') `
                                -Description 'Extracting the release archive'
                  Remove-Item -Path $remoteZipPath -Force
              } -ArgumentList $DestinationPath, $ArchiveName, $SevenZip
              $contentIntact = $true

              Write-Host "================================================================================"
              Write-Host "Starting $SiteDomainName"
              Write-Host "================================================================================"
              Invoke-Command -Session $session -ScriptBlock {
                  param ($SiteDomainName, $Appcmd)
                  Invoke-Native -FilePath $Appcmd `
                                -ArgumentList @('start', 'apppool', $SiteDomainName) `
                                -Description "Starting app pool $SiteDomainName"
                  Invoke-Native -FilePath $Appcmd `
                                -ArgumentList @('start', 'site', $SiteDomainName) `
                                -Description "Starting site $SiteDomainName"
                  Wait-For -Description "site $SiteDomainName to report Started" -TimeoutSeconds 90 -Condition {
                      (& $Appcmd list site "$SiteDomainName" /text:state 2>$null) -eq 'Started'
                  }
              } -ArgumentList $SiteDomainName, $Appcmd
              $iisStopped = $false
          }
          finally {
              if ($session) {
                  if ($iisStopped) {
                      if ($contentIntact) {
                          Write-Host "Deployment failed before $DestinationPath was modified. Restarting $SiteDomainName."
                          Invoke-Command -Session $session -ScriptBlock {
                              param ($SiteDomainName, $Appcmd)
                              & $Appcmd start apppool $SiteDomainName 2>$null | Out-Null
                              & $Appcmd start site    $SiteDomainName 2>$null | Out-Null
                          } -ArgumentList $SiteDomainName, $Appcmd
                      }
                      else {
                          # Starting here would serve a half-written release and let w3wp hold handles that block the next run.
                          Write-Host "::error::Deployment failed with $DestinationPath partially written. $SiteDomainName is deliberately left STOPPED. Restore from the newest ${DestinationPath}_*.7z backup on the sandbox VM, then start the app pool and site."
                      }
                  }
                  Remove-PSSession $session
              }
              if (Test-Path -Path $LocalZipPath) {
                  Remove-Item -Path $LocalZipPath -Force
              }
          }

      #######################################
      # Tag the commit with the release tag #
      #######################################
      # After the deploy, so a release tag can only mean the deployment succeeded.
      - name: Tag the commit with the release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const tagName = process.env.APP_TAG_NAME;
            const shortRef = `tags/${tagName}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${shortRef}`,
                sha: context.sha
              });
              core.info(`Created ${tagName} at ${context.sha}.`);
            } catch (err) {
              if (err.status !== 422) {
                throw err;
              }
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: shortRef
              });
              if (existing.data.object.sha !== context.sha) {
                throw new Error(
                  `Tag ${tagName} already exists at ${existing.data.object.sha}, ` +
                  `but this run deployed ${context.sha}. Version was not incremented.`
                );
              }
              core.info(`Tag ${tagName} already points at ${context.sha}; nothing to do.`);
            }
