
name: Build and deploy to SANDBOXVM

on:
  workflow_call:
    inputs:
      SUBMODULE_APP_CLIENT_ID:
        description: 'GitHub App Client ID used for read-only recursive submodule checkout.'
        type: string
        required: true
      DEPLOYMENT_ENVIRONMENT:
        description: 'Manual deployment target: alpha, dev, or sandbox. Tag deployments derive the target from the ref.'
        type: string
        required: false
        default: ''
      DEPLOY_APP_NAME:
        description: 'The app name to deploy.'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_APP_PRIVATE_KEY:
        required: true
      SANDBOX_VM_USERNAME:
        required: true
      SANDBOX_VM_PASSWORD:
        required: true
      SANDBOX_VM_HOSTNAME:
        required: true

env:
  PUBLISH_DIR: '${{ github.workspace }}\publish'
  TAG_REPOSITORY: true
  ENV_NAME: ''
  SITE_ENV: ''
  DOT_NET_TYPE: ''
  DOTNET_VERSION: ''
  CONFIGURATION: 'Release'
  APP_NAME: ''
  APP_SOLUTION: ''
  APP_PROJECT: ''
  APP_ASSEMBLY: ''
  # Keeps the files/folders in the destination path.
  KEEP_LIST: ''

defaults:
  run:
    shell: pwsh

jobs:
  BuildAndDeployToSandboxVM:
    runs-on: [self-hosted, windows-build-vm]
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: >-
        sandboxvm-deploy-${{ github.repository }}-${{
          github.repository == 'SurePassId/IdentityProvider' && inputs.DEPLOY_APP_NAME || 'default'
        }}-${{
          (startsWith(github.ref, 'refs/tags/deploy2alpha-') && 'alpha')
          || (startsWith(github.ref, 'refs/tags/deploy2dev-') && 'dev')
          || (startsWith(github.ref, 'refs/tags/deploy2sandbox-') && 'sandbox')
          || inputs.DEPLOYMENT_ENVIRONMENT || 'invalid' }}
      cancel-in-progress: false

    steps:
      - name: Validate submodule App configuration
        env:
          SUBMODULE_APP_CLIENT_ID: ${{ inputs.SUBMODULE_APP_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUBMODULE_APP_CLIENT_ID)) {
            Throw "SUBMODULE_APP_CLIENT_ID must contain the GitHub App Client ID."
          }

      - name: Setup workflow variables
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.DEPLOYMENT_ENVIRONMENT }}
          DEPLOY_APP_NAME: ${{ inputs.DEPLOY_APP_NAME }}
        run: |
          $SiteEnv = $env:DEPLOYMENT_ENVIRONMENT
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF -notmatch '^refs/tags/deploy2(?<siteEnv>alpha|dev|sandbox)-.*$') {
              Throw "Invalid deployment tag: $env:GITHUB_REF"
            }
            $TagSiteEnv = $Matches.siteEnv
            if ($SiteEnv -and $SiteEnv -ne $TagSiteEnv) {
              Throw "Deployment environment '$SiteEnv' conflicts with tag environment '$TagSiteEnv'."
            }
            $SiteEnv = $TagSiteEnv
          }
          if ("alpha", "dev", "sandbox" -notcontains $SiteEnv) {
            Throw "Invalid deployment environment: '$SiteEnv'. Expected alpha, dev, or sandbox; manual branch runs must supply DEPLOYMENT_ENVIRONMENT."
          }
          $SiteEnv = $SiteEnv.ToLowerInvariant()
          echo "SITE_ENV=$SiteEnv" >> "$env:GITHUB_ENV"

          switch ($env:GITHUB_REPOSITORY) {
            "SurePassId/SurePassIdLegacyMfaServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=mfa" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePass.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdLegacyMfaServer\SurePassIdLegacyMfaServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassAdmin.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdApiServer" {
              echo "ENV_NAME=mfa-$SiteEnv" >> "${{ github.env }}"
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=10.0.x" >> "${{ github.env }}"
              echo "APP_NAME=api" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdApiServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdApiServer\SurePassIdApiServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=SurePassIdApiServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/SAML2_IdP" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=saml2" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassSAML2.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdp\SurePassIdp.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassSSOIdentityProvider.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdPushServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=push" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\PushServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\PushServer\PushServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassPushServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/IdentityProvider" {
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdOidcServer.sln" >> "${{ github.env }}"
              switch ($env:DEPLOY_APP_NAME) {
                "oidc" {
                  echo "CONFIGURATION=Debug" >> "${{ github.env }}"
                  echo "ENV_NAME=Development" >> "${{ github.env }}"
                  echo "APP_NAME=oidc" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProvider\IdentityProvider.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcServer.dll" >> "${{ github.env }}"
                  echo "KEEP_LIST=keys,logs,spidp_log.txt" >> "${{ github.env }}"
                }
                "oidc-client" {
                  echo "ENV_NAME=oidc-$SiteEnv" >> "${{ github.env }}"
                  echo "TAG_REPOSITORY=false" >> "${{ github.env }}"
                  echo "APP_NAME=oidc-client" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProviderTestApp\IdentityProviderTestApp.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcClient.dll" >> "${{ github.env }}"
                }
                default {
                  Throw "Invalid app name for SurePassId/IdentityProvider: $env:DEPLOY_APP_NAME"
                }
              }
            }
            default {
              Throw "Invalid repository: $env:GITHUB_REPOSITORY"
            }
          }

      ##################
      # Checkout code. #
      ##################
      - name: Mint read-only submodule token
        id: submodule_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            SurePassIdDotNetLibs
            SurePassIdFidoMDS
          permission-contents: read

      - name: Checkout ${{ github.repository }} and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          token: ${{ steps.submodule_token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Clean publish directory
        run: |
          $PublishPath = Join-Path $env:GITHUB_WORKSPACE 'publish'
          if (Test-Path -LiteralPath $PublishPath) {
            if ((Get-Item -LiteralPath $PublishPath).Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
              Throw "Refusing to clean a redirected publish directory: $PublishPath"
            }
            Remove-Item -LiteralPath $PublishPath -Recurse -Force
          }

      ########################
      # .NET Framework steps #
      ########################
      - name: Setup MSBuild path
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Restore the solution's NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_SOLUTION}} `
                  -restore `
                  -verbosity:minimal `
                  -property:RestorePackagesConfig=true

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_PROJECT}} `
                  -target:rebuild `
                  -verbosity:minimal `
                  -property:DeployOnBuild=True `
                  -property:Configuration=${{ env.CONFIGURATION }} `
                  -property:DeployTarget=WebPublish `
                  -property:DeleteExistingFiles=False `
                  -property:PublishProvider=FileSystem `
                  -property:WebPublishMethod=FileSystem `
                  -property:PublishUrl="${{ env.PUBLISH_DIR }}"

      ###################
      # .NET Core steps #
      ###################
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: '${{ runner.temp }}\dotnet'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet restore "${{ env.APP_SOLUTION }}" `
                 --source https://api.nuget.org/v3/index.json

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" `
                 --nologo `
                 --runtime win-x64 `
                 --self-contained true `
                 --configuration ${{ env.CONFIGURATION }} `
                 --output ${{ env.PUBLISH_DIR }} `
                 -p:EnvironmentName=${{ env.ENV_NAME }}

      ####################################
      # Copy envirinment specific files. #
      ####################################
      - name: Copy environment specific files in place.
        uses: SurePassId/copy-web-env-files@042023699388269110326b9f1df4abba8cbd2923 # node24
        with:
          deployment-environment: ${{ env.SITE_ENV }}
          path: "${{ env.PUBLISH_DIR }}"

      #####################################
      # Validate staged repo config files #
      #####################################
      - name: Validate staged deployment configuration
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-ConfigurationJson {
            param([string]$Text)
            try {
              $jsonOptions = [System.Text.Json.JsonDocumentOptions]::new()
              $jsonOptions.CommentHandling = [System.Text.Json.JsonCommentHandling]::Skip
              $jsonOptions.AllowTrailingCommas = $true
              $document = [System.Text.Json.JsonDocument]::Parse($Text, $jsonOptions)
              try {
                function Assert-UniqueProperties {
                  param($Element)
                  if ($Element.ValueKind -eq [System.Text.Json.JsonValueKind]::Object) {
                    $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
                    foreach ($property in $Element.EnumerateObject()) {
                      if (-not $names.Add($property.Name) -or $property.Name.Contains(':')) {
                        throw 'Duplicate or flattened configuration key.'
                      }
                      Assert-UniqueProperties $property.Value
                    }
                  } elseif ($Element.ValueKind -eq [System.Text.Json.JsonValueKind]::Array) {
                    foreach ($elementItem in $Element.EnumerateArray()) {
                      Assert-UniqueProperties $elementItem
                    }
                  }
                }
                Assert-UniqueProperties $document.RootElement
                $result = ConvertFrom-Json -InputObject $Text -AsHashtable
                if ($result -isnot [Collections.IDictionary]) {
                  throw 'Expected an object.'
                }
                return $result
              } finally {
                $document.Dispose()
              }
            } catch {
              throw 'Configuration JSON must be an object with unique case-insensitive keys; details suppressed.'
            }
          }
          function Read-ConfigurationXml {
            param([byte[]]$Bytes, [string]$RootName = 'configuration')
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $stream = [IO.MemoryStream]::new($Bytes, $false)
            try {
              $reader = [Xml.XmlReader]::Create($stream, $settings)
              try {
                $document = [Xml.XmlDocument]::new()
                $document.XmlResolver = $null
                $document.Load($reader)
                if ($document.DocumentElement.Name -cne $RootName -or
                    $document.SelectNodes('//@configSource | //appSettings/@file | //@configProtectionProvider').Count) {
                  throw 'Configuration must be self-contained.'
                }
                return ,$document
              } finally {
                $reader.Dispose()
              }
            } catch {
              throw 'IIS configuration must be valid, self-contained XML without DTDs or encrypted/external sections; details suppressed.'
            } finally {
              $stream.Dispose()
            }
          }
          function Assert-PublishPath {
            param([string]$Path)
            $cursor = [IO.Path]::GetFullPath($Path)
            while ($cursor) {
              $item = Get-Item -LiteralPath $cursor -Force
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'Reparse point in publish path.'
              }
              $cursor = [IO.Path]::GetDirectoryName($cursor)
            }
            foreach ($item in (Get-ChildItem -LiteralPath $Path -Recurse -Force)) {
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'Reparse point in published content.'
              }
            }
          }
          Assert-PublishPath $env:PUBLISH_DIR
          if ([IO.Path]::GetFullPath($env:PUBLISH_DIR).TrimEnd('\') -ine
              [IO.Path]::Combine($env:GITHUB_WORKSPACE, 'publish').TrimEnd('\')) {
            throw 'Configuration validation must use the owned workspace publish directory.'
          }
          if ($env:SITE_ENV -cnotin @('alpha', 'dev', 'sandbox')) {
            throw 'Invalid configuration environment.'
          }
          $webConfigPath = Join-Path $env:PUBLISH_DIR 'web.config'
          if (-not (Test-Path -LiteralPath $webConfigPath -PathType Leaf) -or
              (Get-Item -LiteralPath $webConfigPath).Length -eq 0) {
            throw "Published web.config is missing or empty. Ensure environment-files/$($env:SITE_ENV)/web.config exists in the repository."
          }
          if ($env:APP_NAME -in @('api', 'mfa', 'saml2')) {
            if ($env:KEEP_LIST) {
              throw 'API/MFA/SAML2 deployments use repository configuration; keep-list retention is forbidden.'
            }
            $configuration = Read-ConfigurationXml ([IO.File]::ReadAllBytes($webConfigPath))
            if ($env:APP_NAME -eq 'mfa') {
              $appSettings = @{}
              foreach ($setting in $configuration.SelectNodes('/configuration/appSettings/add')) {
                $settingKey = $setting.GetAttribute('key')
                if ($appSettings.ContainsKey($settingKey)) {
                  throw 'Duplicate MFA appSettings key.'
                }
                $appSettings[$settingKey] = $setting.GetAttribute('value')
              }
            } elseif ($env:APP_NAME -eq 'api') {
              $environmentSettings = @($configuration.SelectNodes('//aspNetCore/environmentVariables/environmentVariable') |
                Where-Object { $_.GetAttribute('name') -in @('ASPNETCORE_ENVIRONMENT', 'DOTNET_ENVIRONMENT') })
              if (-not $environmentSettings.Count -or @($environmentSettings |
                  Where-Object { $_.GetAttribute('value') -cne "mfa-$env:SITE_ENV" }).Count) {
                throw 'Published API IIS environment must match the selected mfa-environment.'
              }
              $utf8 = [Text.UTF8Encoding]::new($false, $true)
              $baseSettings = Read-ConfigurationJson ([IO.File]::ReadAllText((Join-Path $env:PUBLISH_DIR 'appsettings.json')))
              $environmentConfigPath = Join-Path $env:PUBLISH_DIR "appsettings.mfa-$env:SITE_ENV.json"
              $envJsonSettings = Read-ConfigurationJson ([IO.File]::ReadAllText($environmentConfigPath))
              $null = Read-ConfigurationXml ([IO.File]::ReadAllBytes((Join-Path $env:PUBLISH_DIR 'logging.config'))) 'log4net'
              # Normalize JSON without comments/trailing commas so Windows PowerShell 5.1 on sandbox-app validates it cleanly.
              [IO.File]::WriteAllBytes((Join-Path $env:PUBLISH_DIR 'appsettings.json'),
                $utf8.GetBytes(($baseSettings | ConvertTo-Json -Depth 100 -Compress -WarningAction Stop)))
              [IO.File]::WriteAllBytes($environmentConfigPath,
                $utf8.GetBytes(($envJsonSettings | ConvertTo-Json -Depth 100 -Compress -WarningAction Stop)))
              $localConfigPath = Join-Path $env:PUBLISH_DIR 'appsettings.local.json'
              if (Test-Path -LiteralPath $localConfigPath -PathType Leaf) {
                $localSettings = Read-ConfigurationJson ([IO.File]::ReadAllText($localConfigPath))
                [IO.File]::WriteAllBytes($localConfigPath,
                  $utf8.GetBytes(($localSettings | ConvertTo-Json -Depth 100 -Compress -WarningAction Stop)))
              }
              foreach ($settingsFile in (Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Filter 'appsettings.*.json' -File)) {
                if ($settingsFile.Name -cnotin @('appsettings.local.json', "appsettings.mfa-$env:SITE_ENV.json")) {
                  Remove-Item -LiteralPath $settingsFile.FullName -Force
                }
              }
            }
          }
          Write-Host "Validated staged repository configuration for $env:APP_NAME/$env:SITE_ENV."

      - name: Generate Release Tag Name
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        run: |
          $assemblyPath = Join-Path $env:PUBLISH_DIR $env:APP_ASSEMBLY.TrimStart([char]'\')
          if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
            Throw "Expected published assembly was not found: $assemblyPath"
          }
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath).Version
          echo "APP_TAG_NAME=$($env:SITE_ENV)-$version" >> "$env:GITHUB_ENV"

      #######################################
      # Check the release tag before deploy #
      #######################################
      - name: Check release tag before deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const tagName = process.env.APP_TAG_NAME;
            let existing;
            try {
              existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
              core.info(`Release tag ${tagName} is available.`);
              return;
            }
            let target = existing.data.object;
            while (target.type === 'tag') {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: target.sha
              });
              target = annotated.data.object;
            }
            if (target.type !== 'commit' || target.sha !== context.sha) {
              throw new Error(`Release tag ${tagName} already points to ${target.sha}, not ${context.sha}. Increment the application version before deploying.`);
            }
            core.info(`Release tag ${tagName} already identifies this commit.`);

      #############################
      # Deploy files to sandboxvm #
      #############################
      - name: Deploy ${{ env.APP_NAME }}-${{ env.SITE_ENV }}.surepassid.com
        uses: SurePassId/github-workflows/.github/actions/deploy-iis-site@035aafcec81af492af217d3d601e78a4f34b7c91
        with:
          computer-name: ${{ secrets.SANDBOX_VM_HOSTNAME }}
          username: ${{ secrets.SANDBOX_VM_USERNAME }}
          password: ${{ secrets.SANDBOX_VM_PASSWORD }}
          site-env: ${{ env.SITE_ENV }}
          app-name: ${{ env.APP_NAME }}
          source-path: ${{ env.PUBLISH_DIR }}
          app-assembly: ${{ env.APP_ASSEMBLY }}
          run-id: ${{ github.run_id }}-${{ github.run_attempt }}
          keep-list: ${{ env.KEEP_LIST }}

      - name: Tag the successfully deployed commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const tagName = process.env.APP_TAG_NAME;
            try {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha: context.sha
                });
                core.info(`Created ${tagName} for the successfully deployed commit.`);
                return;
              } catch (err) {
                if (err.status !== 422) {
                  throw err;
                }
              }
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              let target = existing.data.object;
              while (target.type === 'tag') {
                const annotated = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: target.sha
                });
                target = annotated.data.object;
              }
              if (target.type !== 'commit' || target.sha !== context.sha) {
                throw new Error(`Release tag ${tagName} conflicts with ${target.sha}.`);
              }
              core.info(`Release tag ${tagName} already identifies the successfully deployed commit.`);
            } catch (err) {
              throw new Error(`Deployment succeeded, but release tagging failed: ${err.message}`, { cause: err });
            }
