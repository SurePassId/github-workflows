
name: Build and deploy to Sandbox Sites

on:
  workflow_call:
    inputs:
      DEPLOY_APP_NAME:
        description: 'The app name to deploy.'
        type: string
        required: false
        default: ''
      RUNNER_LABEL:
        description: 'Runner label; retain validation selection until cutover is approved.'
        type: string
        required: false
        default: 'windows-build-vm-validation'
    secrets: 
      GH_ACTIONS_PAT:
        required: true
      SANDBOX_VM_USERNAME:
        required: true
      SANDBOX_VM_PASSWORD:
        required: true
      SANDBOX_VM_HOSTNAME:
        required: true

env:
  PUBLISH_DIR: '${{ github.workspace }}\publish'
  TAG_REPOSITORY: true
  ENV_NAME: ''
  SITE_ENV: ''
  DOT_NET_TYPE: ''
  DOTNET_VERSION: ''
  CONFIGURATION: 'Release'
  APP_NAME: ''
  APP_SOLUTION: ''
  APP_PROJECT: ''
  APP_ASSEMBLY: ''
  # Keeps the files/folders in the destination path.
  KEEP_LIST: ''

jobs:
  BuildAndDeployToSandboxVM:
    runs-on: [self-hosted, Windows, '${{ inputs.RUNNER_LABEL }}']
    defaults:
      run:
        shell: pwsh
    concurrency:
      group: sandbox-app-${{ github.repository }}-${{ github.ref_name }}-${{ inputs.DEPLOY_APP_NAME }}
      cancel-in-progress: false

    steps:
      - name: Clean workspace
        run: |
          if (Test-Path -Path "${{ github.workspace }}") {
            Remove-Item -Recurse -Force -Path "${{ github.workspace }}\*"
          }

      - name: Setup workflow variables
        run: |
          $SiteEnv = ("${{ github.ref }}" -split "/")[-1]
          if ("alpha", "dev", "sandbox" -notcontains "$SiteEnv") {
            Throw "Invalid branch: ${{ github.ref }}"
          }
          echo "SITE_ENV=$SiteEnv" >> "${{ github.env }}"

          switch ("${{ github.repository }}") {
            "SurePassId/SurePassIdLegacyMfaServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=mfa" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePass.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdLegacyMfaServer\SurePassIdLegacyMfaServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassAdmin.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdApiServer" {
              echo "ENV_NAME=mfa-$SiteEnv" >> "${{ github.env }}"
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_NAME=api" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdApiServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdApiServer\SurePassIdApiServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=SurePassIdApiServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdMfaServer" {
              echo "ENV_NAME=mfa-$SiteEnv" >> "${{ github.env }}"
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_NAME=api" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdApiServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdApiServer\SurePassIdApiServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=SurePassIdApiServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdPushServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=push" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\PushServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\PushServer\PushServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassPushServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/IdentityProvider" {
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdOidcServer.sln" >> "${{ github.env }}"
              switch ("${{ inputs.DEPLOY_APP_NAME }}") {
                "oidc" {
                  echo "CONFIGURATION=Debug" >> "${{ github.env }}"
                  echo "ENV_NAME=Development" >> "${{ github.env }}"
                  echo "APP_NAME=oidc" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProvider\IdentityProvider.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcServer.dll" >> "${{ github.env }}"
                  echo "KEEP_LIST=keys,logs,spidp_log.txt" >> "${{ github.env }}"
                }
                "oidc-client" {
                  echo "ENV_NAME=oidc-$SiteEnv" >> "${{ github.env }}"
                  echo "TAG_REPOSITORY=false" >> "${{ github.env }}"
                  echo "APP_NAME=oidc-client" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProviderTestApp\IdentityProviderTestApp.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcClient.dll" >> "${{ github.env }}"
                }
                default {
                  Throw "Invalid app name for SurePassId/IdentityProvider: ${{ inputs.DEPLOY_APP_NAME }}"
                }
              }
            }
            default {
              Throw "Invalid repository: ${{ github.repository }}"
            }
          }

      ##################
      # Checkout code. #
      ##################
      - name: Checkout ${{ github.repository }} and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_ACTIONS_PAT }}
          persist-credentials: false
          fetch-depth: 0

      ########################
      # .NET Framework steps #
      ########################
      - name: Setup MSBuild path
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: microsoft/setup-msbuild@v2

      - name: Restore the solution's NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_SOLUTION}} `
                  -restore `
                  -verbosity:minimal `
                  -property:RestorePackagesConfig=true

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_PROJECT}} `
                  -target:rebuild `
                  -verbosity:minimal `
                  -property:DeployOnBuild=True `
                  -property:Configuration=${{ env.CONFIGURATION }} `
                  -property:DeployTarget=WebPublish `
                  -property:DeleteExistingFiles=False `
                  -property:PublishProvider=FileSystem `
                  -property:WebPublishMethod=FileSystem `
                  -property:PublishUrl="${{ env.PUBLISH_DIR }}"

      ###################
      # .NET Core steps #
      ###################
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet restore "${{ env.APP_SOLUTION }}" `
                 --source https://api.nuget.org/v3/index.json

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" `
                 --nologo `
                 --runtime win-x64 `
                 --self-contained true `
                 --configuration ${{ env.CONFIGURATION }} `
                 --output ${{ env.PUBLISH_DIR }} `
                 -p:EnvironmentName=${{ env.ENV_NAME }}

      ####################################
      # Copy envirinment specific files. #
      ####################################
      - name: Copy environment specific files in place.
        uses: SurePassId/copy-web-env-files@main
        with:
          deployment-environment: ${{ env.SITE_ENV }}
          path: "${{ env.PUBLISH_DIR }}"

      ##############################
      # Generate Release Tag Name. #
      ##############################
      - name: Generate Release Tag Name
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        run: |
          $assembly = [System.Reflection.Assembly]::LoadFile("${{ env.PUBLISH_DIR }}\${{ env.APP_ASSEMBLY }}")
          $version = $assembly.GetName().Version
          echo "APP_TAG_NAME=${{ env.SITE_ENV }}-$version" >> "${{ github.env }}"

      #######################################
      # Tag the commit with the release tag #
      #######################################
      - name: Tag the commit with the release tag
        uses: actions/github-script@v7
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const {APP_TAG_NAME} = process.env          
            github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${APP_TAG_NAME}`,
                sha: context.sha
            })

      # Deploy through the restricted endpoint, not the default remoting endpoint.
      - name: Deploy ${{ env.APP_NAME }}-${{ env.SITE_ENV }} through the Sandbox endpoint
        env:
          SANDBOX_DEPLOY_USERNAME: ${{ secrets.SANDBOX_VM_USERNAME }}
          SANDBOX_DEPLOY_PASSWORD: ${{ secrets.SANDBOX_VM_PASSWORD }}
          SANDBOX_DEPLOY_HOSTNAME: ${{ secrets.SANDBOX_VM_HOSTNAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SANDBOX_DEPLOY_HOSTNAME -ine 'SANDBOX-APP' -or
            $env:SANDBOX_DEPLOY_USERNAME -ine 'SANDBOX-APP\github-deploy') {
            throw 'Deployment secrets must select SANDBOX-APP and its dedicated github-deploy account.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SANDBOX_DEPLOY_PASSWORD)) {
            throw 'Sandbox deployment password is missing.'
          }
          $siteName = "$env:APP_NAME-$env:SITE_ENV.surepassid.com"
          $packagePath = Join-Path $env:TEMP ("sandbox-deploy-" + [guid]::NewGuid().ToString('N') + '.zip')
          $session = $null
          $proxyModule = $null
          $uploadId = $null
          $stream = $null
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::CreateFromDirectory($env:PUBLISH_DIR, $packagePath, 'Optimal', $false)
            $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
            $securePassword = ConvertTo-SecureString $env:SANDBOX_DEPLOY_PASSWORD -AsPlainText -Force
            $credential = [System.Management.Automation.PSCredential]::new($env:SANDBOX_DEPLOY_USERNAME, $securePassword)
            Remove-Item Env:\SANDBOX_DEPLOY_PASSWORD
            $session = New-PSSession -ComputerName $env:SANDBOX_DEPLOY_HOSTNAME `
              -ConfigurationName 'SurePassID.SandboxDeploy' -Authentication Negotiate -Credential $credential
            $commands = 'New-SandboxUpload', 'Add-SandboxUploadChunk', 'Complete-SandboxDeployment', 'Remove-SandboxUpload'
            $proxyModule = Import-PSSession -Session $session -CommandName $commands -Prefix Remote -DisableNameChecking
            $uploadId = New-RemoteSandboxUpload -SiteName $siteName
            $stream = [System.IO.File]::OpenRead($packagePath)
            if ($stream.Length -gt 4GB) { throw 'Package exceeds the endpoint upload limit of 4 GiB.' }
            $buffer = [byte[]]::new(192KB)
            $offset = 0L
            while (($count = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $base64 = [Convert]::ToBase64String($buffer, 0, $count)
              $received = Add-RemoteSandboxUploadChunk -UploadId $uploadId -Offset $offset -Base64 $base64
              $offset += $count
              if ([long]$received -ne $offset) { throw 'Endpoint upload acknowledgement mismatch.' }
            }
            $stream.Dispose()
            $stream = $null
            $result = Complete-RemoteSandboxDeployment -UploadId $uploadId -Sha256 $hash
            $result | Select-Object SiteName, Destination, Backup, State | Format-List
          } finally {
            if ($stream) { $stream.Dispose() }
            if ($uploadId -and $session -and $session.State -eq 'Opened' -and $proxyModule) {
              try { Remove-RemoteSandboxUpload -UploadId $uploadId }
              catch { Write-Warning "Remote staging cleanup failed for upload ${uploadId}: $_" }
            }
            if ($proxyModule) { Remove-Module $proxyModule }
            if ($session) { Remove-PSSession $session }
            if (Test-Path -LiteralPath $packagePath) { Remove-Item -LiteralPath $packagePath -Force }
            Remove-Item Env:\SANDBOX_DEPLOY_PASSWORD -ErrorAction SilentlyContinue
          }
