name: Build and deploy to SANDBOXVM

on:
  workflow_call:
    inputs:
      DEPLOY_APP_NAME:
        description: "The app name to deploy."
        type: string
        required: false
        default: ""
      DEPLOYMENT_ENVIRONMENT:
        description: "Target environment: alpha, dev, or sandbox. Derived from the ref when omitted."
        type: string
        required: false
        default: ""
    secrets:
      SUBMODULE_APP_ID:
        required: true
      SUBMODULE_APP_PRIVATE_KEY:
        required: true
      SANDBOX_VM_USERNAME:
        required: true
      SANDBOX_VM_PASSWORD:
        required: true
      SANDBOX_VM_HOSTNAME:
        required: true

env:
  PUBLISH_DIR: '${{ github.workspace }}\publish'
  TAG_REPOSITORY: true
  ENV_NAME: ""
  SITE_ENV: ""
  DOT_NET_TYPE: ""
  DOTNET_VERSION: ""
  CONFIGURATION: "Release"
  APP_NAME: ""
  APP_SOLUTION: ""
  APP_PROJECT: ""
  APP_ASSEMBLY: ""
  # Keeps the files/folders in the destination path.
  KEEP_LIST: ""

# Explicit so the runner never falls back to Windows PowerShell 5.1, whose `>>` writes UTF-16LE and corrupts $GITHUB_ENV.
defaults:
  run:
    shell: pwsh

jobs:
  BuildAndDeployToSandboxVM:
    runs-on: [self-hosted, windows-build-vm]
    timeout-minutes: 45
    permissions:
      contents: write # release tag only
    concurrency:
      # Keyed on the environment, not on github.ref_name: deploy tags are unique per deploy, so ref_name would never collide.
      # The `env` context is unavailable here, hence the expression restates the tag parsing done in "Setup workflow variables".
      group: >-
        sandboxvm-${{ github.repository }}-${{ inputs.DEPLOY_APP_NAME || 'default' }}-${{
          inputs.DEPLOYMENT_ENVIRONMENT
          || (startsWith(github.ref_name, 'deploy2alpha') && 'alpha')
          || (startsWith(github.ref_name, 'deploy2dev') && 'dev')
          || (startsWith(github.ref_name, 'deploy2sandbox') && 'sandbox')
          || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Setup workflow variables
        env:
          # Via env rather than interpolation: a ref or input is caller-controlled text.
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.DEPLOYMENT_ENVIRONMENT }}
        run: |
          # Derived here rather than in each caller, so the set of environments lives in one place.
          $SiteEnv = $env:DEPLOYMENT_ENVIRONMENT
          if (-not $SiteEnv) {
            # Optional trailing UTC timestamp: deploy tags are unique per deploy, since a moved tag does not reliably trigger a workflow.
            if ($env:GITHUB_REF -match '^refs/tags/deploy2(alpha|dev|sandbox)(-\d{4}\.\d{2}\.\d{2}-\d{2}\.\d{2}\.\d{2})?$') {
              $SiteEnv = $Matches[1]
            }
            else {
              Throw "Cannot derive a deployment environment from '$($env:GITHUB_REF)'. Push a deploy2<env>-<yyyy.MM.dd>-<HH.mm.ss> tag, or pass DEPLOYMENT_ENVIRONMENT."
            }
          }
          if ("alpha", "dev", "sandbox" -notcontains $SiteEnv) {
            Throw "Invalid deployment environment: '$SiteEnv'. Expected alpha, dev, or sandbox."
          }
          echo "SITE_ENV=$SiteEnv" >> "${{ github.env }}"

          switch ("${{ github.repository }}") {
            "SurePassId/SurePassIdLegacyMfaServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=mfa" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePass.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdLegacyMfaServer\SurePassIdLegacyMfaServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassAdmin.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdApiServer" {
              echo "ENV_NAME=mfa-$SiteEnv" >> "${{ github.env }}"
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_NAME=api" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdApiServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\SurePassIdApiServer\SurePassIdApiServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=SurePassIdApiServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/SurePassIdPushServer" {
              echo "DOT_NET_TYPE=framework" >> "${{ github.env }}"
              echo "APP_NAME=push" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\PushServer.sln" >> "${{ github.env }}"
              echo "APP_PROJECT=.\PushServer\PushServer.csproj" >> "${{ github.env }}"
              echo "APP_ASSEMBLY=\bin\SurePassPushServer.dll" >> "${{ github.env }}"
            }
            "SurePassId/IdentityProvider" {
              echo "DOT_NET_TYPE=core" >> "${{ github.env }}"
              echo "DOTNET_VERSION=8.0.x" >> "${{ github.env }}"
              echo "APP_SOLUTION=.\SurePassIdOidcServer.sln" >> "${{ github.env }}"
              switch ("${{ inputs.DEPLOY_APP_NAME }}") {
                "oidc" {
                  echo "CONFIGURATION=Debug" >> "${{ github.env }}"
                  echo "ENV_NAME=Development" >> "${{ github.env }}"
                  echo "APP_NAME=oidc" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProvider\IdentityProvider.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcServer.dll" >> "${{ github.env }}"
                  echo "KEEP_LIST=keys,logs,spidp_log.txt" >> "${{ github.env }}"
                }
                "oidc-client" {
                  echo "ENV_NAME=oidc-$SiteEnv" >> "${{ github.env }}"
                  echo "TAG_REPOSITORY=false" >> "${{ github.env }}"
                  echo "APP_NAME=oidc-client" >> "${{ github.env }}"
                  echo "APP_PROJECT=.\IdentityProviderTestApp\IdentityProviderTestApp.csproj" >> "${{ github.env }}"
                  echo "APP_ASSEMBLY=SurePassIdOidcClient.dll" >> "${{ github.env }}"
                }
                default {
                  Throw "Invalid app name for SurePassId/IdentityProvider: ${{ inputs.DEPLOY_APP_NAME }}"
                }
              }
            }
            default {
              Throw "Invalid repository: ${{ github.repository }}"
            }
          }

      ##################
      # Checkout code. #
      ##################
      - name: Mint submodule token
        id: submodule_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SUBMODULE_APP_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout ${{ github.repository }} and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          token: ${{ steps.submodule_token.outputs.token }}
          persist-credentials: false

      # Neither publish path removes files that are no longer produced (MSBuild runs with DeleteExistingFiles=False,
      # and `dotnet publish --output` only overwrites), so a stale assembly would otherwise be deployed.
      - name: Clean publish directory
        run: |
          if (Test-Path -LiteralPath "${{ env.PUBLISH_DIR }}") {
            Remove-Item -LiteralPath "${{ env.PUBLISH_DIR }}" -Recurse -Force
          }

      ########################
      # .NET Framework steps #
      ########################
      - name: Setup MSBuild path
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Restore the solution's NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_SOLUTION}} `
                  -restore `
                  -verbosity:minimal `
                  -property:RestorePackagesConfig=true

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        run: |
          msbuild ${{env.APP_PROJECT}} `
                  -target:rebuild `
                  -verbosity:minimal `
                  -property:DeployOnBuild=True `
                  -property:Configuration=${{ env.CONFIGURATION }} `
                  -property:DeployTarget=WebPublish `
                  -property:DeleteExistingFiles=False `
                  -property:PublishProvider=FileSystem `
                  -property:WebPublishMethod=FileSystem `
                  -property:PublishUrl="${{ env.PUBLISH_DIR }}"

      ###################
      # .NET Core steps #
      ###################
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages.
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet restore "${{ env.APP_SOLUTION }}" `
                 --runtime win-x64 `
                 --source https://api.nuget.org/v3/index.json

      - name: Build ${{ env.APP_PROJECT }}
        if: ${{ env.DOT_NET_TYPE == 'core' }}
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" `
                 --nologo `
                 --runtime win-x64 `
                 --self-contained false `
                 --no-restore `
                 --configuration ${{ env.CONFIGURATION }} `
                 --output ${{ env.PUBLISH_DIR }} `
                 -p:EnvironmentName=${{ env.ENV_NAME }}

      ####################################
      # Copy environment specific files. #
      ####################################
      - name: Copy environment specific files in place.
        if: ${{ env.DOT_NET_TYPE == 'framework' }}
        uses: SurePassId/copy-web-env-files@042023699388269110326b9f1df4abba8cbd2923 # node24 runtime bump
        with:
          deployment-environment: ${{ env.SITE_ENV }}
          path: "${{ env.PUBLISH_DIR }}"

      ##############################
      # Generate Release Tag Name. #
      ##############################
      - name: Generate Release Tag Name
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        run: |
          $assemblyPath = Join-Path '${{ env.PUBLISH_DIR }}' '${{ env.APP_ASSEMBLY }}'
          if (-not (Test-Path -Path $assemblyPath)) {
              throw "Expected assembly not found at $assemblyPath. The publish step produced nothing usable."
          }
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath).Version
          echo "APP_TAG_NAME=${{ env.SITE_ENV }}-$version" >> "${{ github.env }}"

      #############################
      # Deploy files to sandboxvm #
      #############################
      - name: Deploy ${{ env.APP_NAME }}-${{ env.SITE_ENV }}.surepassid.com to sandboxvm
        # Pinned to this repository rather than `./` because a reusable workflow only ever has the *caller's* repository checked out.
        # TODO: repoint to a commit SHA on main once this branch merges — the action does not exist on main yet.
        uses: SurePassId/github-workflows/.github/actions/deploy-iis-site@feat/sandboxvm-hardening
        with:
          computer-name: ${{ secrets.SANDBOX_VM_HOSTNAME }}
          username: ${{ secrets.SANDBOX_VM_USERNAME }}
          password: ${{ secrets.SANDBOX_VM_PASSWORD }}
          site-env: ${{ env.SITE_ENV }}
          app-name: ${{ env.APP_NAME }}
          source-path: ${{ env.PUBLISH_DIR }}
          app-assembly: ${{ env.APP_ASSEMBLY }}
          run-id: ${{ github.run_id }}-${{ github.run_attempt }}
          keep-list: ${{ env.KEEP_LIST }}

      #######################################
      # Tag the commit with the release tag #
      #######################################
      # After the deploy, so a release tag can only mean the deployment succeeded.
      - name: Tag the commit with the release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ env.TAG_REPOSITORY == 'true' }}
        with:
          script: |
            const tagName = process.env.APP_TAG_NAME;
            const shortRef = `tags/${tagName}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${shortRef}`,
                sha: context.sha
              });
              core.info(`Created ${tagName} at ${context.sha}.`);
            } catch (err) {
              if (err.status !== 422) {
                throw err;
              }
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: shortRef
              });
              if (existing.data.object.sha !== context.sha) {
                throw new Error(
                  `Tag ${tagName} already exists at ${existing.data.object.sha}, ` +
                  `but this run deployed ${context.sha}. Version was not incremented.`
                );
              }
              core.info(`Tag ${tagName} already points at ${context.sha}; nothing to do.`);
            }
